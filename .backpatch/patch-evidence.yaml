    basis: backport
    artifacts:
      - org.springframework.ws:spring-xml
      - org.springframework.ws:spring-ws-core
      - org.springframework.ws:spring-ws-security
    note: New in this release; ported onto 4.0.17; fixed at 4.0.17.1-backpatch-00002 (backpatch-spring-ws@33301d0). `Wss4jSecurityInterceptor` now enforces the WS-I Basic Security Profile when it validates inbound messages, as WSS4J does by default (CVE-2026-40994). If your service accepts WS-Security headers from peers that break a BSP rule WSS4J checks, for example a `UsernameToken` whose `Password` element has no `Type` attribute, those requests now get a SOAP fault where 4.0.17 accepted them. Ask the peer to send conformant headers, or set `bspCompliant` to `false` on the interceptor (`setBspCompliant(false)`), which brings back the exposure the fix closes.
