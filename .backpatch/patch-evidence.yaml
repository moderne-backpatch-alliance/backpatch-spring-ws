  - cve: CVE-2026-40994
    upstream_fix_url: https://github.com/spring-projects/spring-ws/commit/9f1cea1d6fa14f082e0e7da195f76ccccf87682e
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-40994
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-spring-ws/commit/33301d0
    basis: backport
    artifacts:
      - org.springframework.ws:spring-xml
      - org.springframework.ws:spring-ws-core
      - org.springframework.ws:spring-ws-security
    note: Carried from 4.0.17.1-backpatch-00002; ported onto 4.0.17; fixed at 4.0.17.1-backpatch-00002 (backpatch-spring-ws@33301d0). `Wss4jSecurityInterceptor` now enforces the WS-I Basic Security Profile when it validates inbound messages, as WSS4J does by default (CVE-2026-40994). If your service accepts WS-Security headers from peers that break a BSP rule WSS4J checks, for example a `UsernameToken` whose `Password` element has no `Type` attribute, those requests now get a SOAP fault where 4.0.17 accepted them. Ask the peer to send conformant headers, or set `bspCompliant` to `false` on the interceptor (`setBspCompliant(false)`), which brings back the exposure the fix closes.
  - cve: CVE-2026-40995
    upstream_fix_url: https://github.com/spring-projects/spring-ws/commit/e5dc311359e14f5b25bcb33f20d43cc3513e9d10
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-40995
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-spring-ws/commit/1df33be
    basis: backport
    artifacts:
      - org.springframework.ws:spring-xml
      - org.springframework.ws:spring-ws-core
      - org.springframework.ws:spring-ws-security
    note: Carried from 4.0.17.1-backpatch-00003; ported onto 4.0.17; fixed at 4.0.17.1-backpatch-00003 (backpatch-spring-ws@1df33be).
  - cve: CVE-2026-40996
    upstream_fix_url: https://github.com/spring-projects/spring-ws/commit/abab9992d15d8860627993987182edc8189ade93
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-40996
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-spring-ws/commit/96c5a7c
    basis: backport
    artifacts:
      - org.springframework.ws:spring-xml
      - org.springframework.ws:spring-ws-core
      - org.springframework.ws:spring-ws-security
    note: Carried from 4.0.17.1-backpatch-00004; ported onto 4.0.17; fixed at 4.0.17.1-backpatch-00004 (backpatch-spring-ws@96c5a7c). `Wss4jSecurityInterceptor` now refuses inbound messages whose symmetric key is encrypted with RSA PKCS#1 v1.5 key transport, `http://www.w3.org/2001/04/xmlenc#rsa-1_5` (CVE-2026-40996). If your service decrypts requests from peers configured for that algorithm, those requests now get a SOAP fault where 4.0.17 decrypted them. Ask the peer to switch to RSA-OAEP, `http://www.w3.org/2001/04/xmlenc#rsa-oaep-mgf1p` (a Spring-WS client sets it with `securementEncryptionKeyTransportAlgorithm`), or set `allowRSA15KeyTransportAlgorithm` to `true` on the interceptor, which brings back the exposure the fix closes.
  - cve: CVE-2026-40997
    upstream_fix_url: https://github.com/spring-projects/spring-ws/commit/5051fae1a836c4d7fa12dedebdca23494764e421
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-40997
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-spring-ws/commit/08d6c60
    basis: backport
    artifacts:
      - org.springframework.ws:spring-xml
      - org.springframework.ws:spring-ws-core
      - org.springframework.ws:spring-ws-security
    note: Carried from 4.0.17.1-backpatch-00005; ported onto 4.0.17; fixed at 4.0.17.1-backpatch-00005 (backpatch-spring-ws@08d6c60).
  - cve: CVE-2026-40999
    upstream_fix_url: https://github.com/advisories/GHSA-whpp-xv3h-rwxf
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-40999
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-spring-ws/compare/3255347~1...8f99e99
    basis: adapted
    artifacts:
      - org.springframework.ws:spring-xml
      - org.springframework.ws:spring-ws-core
      - org.springframework.ws:spring-ws-security
    note: New in this release; ported onto 4.0.17; fixed at 4.0.17.1-backpatch-00006 (backpatch-spring-ws@3255347..8f99e99). WS-Addressing endpoints (`@Action` methods, `SimpleActionEndpointMapping` and other `AbstractAddressingEndpointMapping` subclasses) now screen the `wsa:ReplyTo` and `wsa:FaultTo` addresses a peer sends, and run their interceptors by `Ordered` order (CVE-2026-40999). If a request names a non-anonymous reply address that none of the mapping's `messageSenders` supports (a mapping has none unless you configure them), or an `http` or `https` address whose host is `localhost` or a loopback, link-local, wildcard or private IPv4 literal such as `10.0.0.1`, the peer now gets an invalid addressing header fault where 4.0.17 replied. After the pre-interceptors, interceptors now run as WS-Security (-200), addressing (0), smart interceptors such as `PayloadRootSmartSoapEndpointInterceptor` (100), then unordered ones, so an interceptor added in `WsConfigurer.addInterceptors` runs after the smart ones where 4.0.17 ran it before them. Configure `messageSenders` for the reply schemes you serve, start with `-Dspring-ws.addressing.allow-site-local-ipv4=true` to admit private IPv4 addresses (this brings back part of the exposure the fix closes), and implement `Ordered` on an interceptor that must run earlier.
